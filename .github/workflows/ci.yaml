name: DevOps Order Platform CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-ci:
    name: Test Backend and Build Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.lock

      - name: Check dependency consistency
        run: python -m pip check

      - name: Check code linting
        run: ruff check backend/

      - name: Check code formatting
        run: ruff format --check backend/

      - name: Run backend tests with coverage
        run: |
          python -m pytest \
            -v \
            -p no:cacheprovider \
            --cov=backend/app \
            --cov-report=term-missing \
            --cov-fail-under=95 \
            backend/tests/

      - name: Build backend Docker image
        run: |
          docker build \
            --tag devops-order-platform-backend:ci \
            --file backend/Dockerfile \
            backend

      - name: Scan backend image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: devops-order-platform-backend:ci
          scan-type: image
          scanners: vuln
          severity: CRITICAL
          exit-code: '1'

  publish-image:
    name: Publish Backend Image to GHCR

    needs: backend-ci

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=long,prefix=sha-
            type=raw,value=main

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Display published image digest
        run: |
          echo "Published image digest: ${{ steps.build.outputs.digest }}"

      - name: Scan published GHCR image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
          scan-type: image
          scanners: vuln
          severity: CRITICAL
          exit-code: '1'

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.0.0

      - name: Sign published image with Cosign
        env:
          IMAGE_REF: ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "${IMAGE_REF}"

      - name: Verify published image signature
        env:
          IMAGE_REF: ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
          CERT_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/ci.yaml@${{ github.ref }}
          OIDC_ISSUER: https://token.actions.githubusercontent.com
        run: |
          cosign verify \
            --certificate-identity "${CERT_IDENTITY}" \
            --certificate-oidc-issuer "${OIDC_ISSUER}" \
            "${IMAGE_REF}"

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@v0

      - name: Generate CycloneDX SBOM
        env:
          IMAGE_REF: ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
        run: |
          mkdir -p security-reports

          syft "${IMAGE_REF}" \
            --output cyclonedx-json=security-reports/backend-sbom.cdx.json

          test -s security-reports/backend-sbom.cdx.json

      - name: Upload CycloneDX SBOM
        uses: actions/upload-artifact@v4
        with:
          name: backend-cyclonedx-sbom
          path: security-reports/backend-sbom.cdx.json
          if-no-files-found: error
          retention-days: 30

      - name: Attest CycloneDX SBOM with Cosign
        env:
          IMAGE_REF: ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
        run: |
          cosign attest \
            --yes \
            --type cyclonedx \
            --predicate security-reports/backend-sbom.cdx.json \
            "${IMAGE_REF}"

      - name: Verify CycloneDX SBOM attestation
        env:
          IMAGE_REF: ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
          CERT_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/ci.yaml@${{ github.ref }}
          OIDC_ISSUER: https://token.actions.githubusercontent.com
        run: |
          cosign verify-attestation \
            --type cyclonedx \
            --certificate-identity "${CERT_IDENTITY}" \
            --certificate-oidc-issuer "${OIDC_ISSUER}" \
            "${IMAGE_REF}"

      - name: Generate Trivy vulnerability report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
          scan-type: image
          scanners: vuln
          format: json
          output: security-reports/backend-trivy-report.json
          severity: CRITICAL,HIGH,MEDIUM,LOW
          exit-code: '0'

      - name: Prepare security report directory
        run: mkdir -p security-reports

      - name: Upload Trivy vulnerability report
        uses: actions/upload-artifact@v4
        with:
          name: backend-trivy-vulnerability-report
          path: security-reports/backend-trivy-report.json
          if-no-files-found: error
          retention-days: 30
