global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts/*.yml

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "order-platform-backend"
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]

  - job_name: "rabbitmq"
    metrics_path: /metrics
    static_configs:
      - targets: ["rabbitmq:15692"]

  - job_name: "rabbitmq-per-queue"
    metrics_path: /metrics/per-object
    scrape_interval: 30s
    static_configs:
      - targets: ["rabbitmq:15692"]

  - job_name: "order-platform-outbox"
    metrics_path: /metrics
    scrape_interval: 15s
    static_configs:
      - targets:
          - "outbox-exporter:9108"